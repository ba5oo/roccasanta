<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trullo Rocca Santa — Ostuni, Puglia</title>
  <meta name="description" content="Autentico trullo pugliese restaurato nella campagna di Ostuni. Prenota direttamente per il miglior prezzo." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:    #100f0d;
      --white:    #faf8f5;
      --bone:     #ede8e0;
      --stone:    #bdb5aa;
      --terra:    #a0522a;
      --terra-dk: #7d3f1e;
      --terra-lt: #c97848;
      --text:     #28231e;
      --text-lt:  #6e6560;
      --serif:    'DM Serif Display', Georgia, serif;
      --sans:     'DM Sans', sans-serif;
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--white);
      color: var(--text);
      font-family: var(--sans);
      font-weight: 300;
      line-height: 1.65;
      overflow-x: hidden;
    }

    /* ─── NAV ─── */
    #nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 1.8rem 3.5rem;
      transition: background 0.4s, padding 0.4s, border-color 0.4s;
      border-bottom: 1px solid transparent;
    }
    #nav.scrolled {
      background: rgba(250,248,245,0.97);
      padding: 1rem 3.5rem;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom-color: var(--bone);
    }
    .nav-left  { display: flex; gap: 2.8rem; align-items: center; }
    .nav-right { display: flex; gap: 1.8rem; align-items: center; justify-content: flex-end; }

    .nav-logo {
      font-family: var(--serif);
      font-size: 1.05rem;
      letter-spacing: 0.05em;
      text-align: center;
      color: rgba(255,255,255,0.95);
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.3s;
    }
    #nav.scrolled .nav-logo { color: var(--black); }

    .nav-link {
      font-size: 0.69rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      color: rgba(255,255,255,0.82);
      transition: color 0.2s;
    }
    #nav.scrolled .nav-link { color: var(--text-lt); }
    .nav-link:hover { color: var(--terra-lt) !important; }

    .nav-cta {
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      color: rgba(255,255,255,0.9);
      border: 1px solid rgba(255,255,255,0.5);
      padding: 0.5rem 1.2rem;
      transition: all 0.25s;
    }
    #nav.scrolled .nav-cta { color: var(--terra); border-color: var(--terra); }
    .nav-cta:hover {
      background: var(--terra) !important;
      border-color: var(--terra) !important;
      color: var(--white) !important;
    }

    /* ─── HERO ─── */
    #hero {
      position: relative;
      height: 100vh;
      min-height: 620px;
      display: flex;
      align-items: center;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute;
      inset: -6%;
      background: url('photos/vista1.jpg') center/cover no-repeat;
      animation: heroZoom 14s ease-out forwards;
      will-change: transform;
    }
    @keyframes heroZoom {
      from { transform: scale(1.1); }
      to   { transform: scale(1.0); }
    }
    .hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(
        120deg,
        rgba(10,8,6,0.70) 0%,
        rgba(10,8,6,0.40) 60%,
        rgba(10,8,6,0.20) 100%
      );
    }
    .hero-content {
      position: relative;
      z-index: 2;
      padding: 0 3.5rem 0 8vw;
      max-width: 760px;
      animation: fadeUp 1.1s 0.3s both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .hero-location {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 0.64rem;
      font-weight: 400;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
      margin-bottom: 1.6rem;
    }
    .hero-location::before {
      content: '';
      display: block;
      width: 24px; height: 1px;
      background: var(--terra-lt);
    }
    .hero-title {
      font-family: var(--serif);
      font-size: clamp(3rem, 8vw, 7rem);
      font-weight: 400;
      color: var(--white);
      line-height: 1.05;
      margin-bottom: 1.4rem;
    }
    .hero-title em {
      font-style: italic;
      color: rgba(255,255,255,0.7);
    }
    .hero-sub {
      font-size: 1rem;
      font-weight: 300;
      color: rgba(255,255,255,0.75);
      line-height: 1.8;
      max-width: 48ch;
      margin-bottom: 2rem;
    }
    .hero-btns { display: flex; gap: 1rem; flex-wrap: wrap; }
    .btn-hero-primary {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 0.9rem 2.2rem;
      background: var(--terra);
      color: var(--white);
      transition: background 0.25s;
    }
    .btn-hero-primary:hover { background: var(--terra-dk); }
    .btn-hero-ghost {
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 0.9rem 2.2rem;
      border: 1px solid rgba(255,255,255,0.45);
      color: rgba(255,255,255,0.85);
      transition: background 0.25s, border-color 0.25s;
    }
    .btn-hero-ghost:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.7);
    }

    /* ─── INTRO ─── */
    #trullo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 75vh;
    }
    .intro-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 7rem 5rem 7rem 8vw;
    }
    .eyebrow {
      font-size: 0.65rem;
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--terra);
      display: block;
      margin-bottom: 1rem;
    }
    .intro-text h2 {
      font-family: var(--serif);
      font-size: clamp(2rem, 3.2vw, 3rem);
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 1.5rem;
    }
    .intro-text p {
      font-size: 0.97rem;
      color: var(--text-lt);
      line-height: 1.85;
      max-width: 46ch;
      margin-bottom: 1.1rem;
    }
    .btn-outline-terra {
      display: inline-block;
      margin-top: 1rem;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--terra);
      border-bottom: 1px solid var(--terra);
      padding-bottom: 2px;
      transition: color 0.2s, border-color 0.2s;
    }
    .btn-outline-terra:hover { color: var(--terra-dk); border-color: var(--terra-dk); }
    .intro-photo { overflow: hidden; }
    .intro-photo img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      transition: transform 0.8s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    .intro-photo:hover img { transform: scale(1.04); }

    /* ─── INFO STRIP ─── */
    .info-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--bone);
      border-top: 1px solid var(--stone);
      border-bottom: 1px solid var(--stone);
    }
    .info-item {
      padding: 2.2rem 2rem;
      border-right: 1px solid var(--stone);
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .info-item:last-child { border-right: none; }
    .info-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      color: var(--terra);
    }
    .info-icon svg { width: 100%; height: 100%; }
    .info-label {
      font-size: 0.62rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--stone);
      margin-bottom: 0.25rem;
    }
    .info-value {
      font-family: var(--serif);
      font-size: 0.95rem;
      color: var(--text);
    }

    /* ─── GALLERY ─── */
    #gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: 320px 240px;
      gap: 4px;
    }
    .g-item { overflow: hidden; background: var(--stone); }
    .g-item img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      transition: transform 0.7s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    .g-item:hover img { transform: scale(1.05); }
    .g-item.tall { grid-row: span 2; }

    /* ─── FEATURES ─── */
    #features {
      padding: 7rem 8vw;
      background: var(--white);
    }
    .features-header {
      display: grid;
      grid-template-columns: 1fr;
      padding-bottom: 3.5rem;
      margin-bottom: 3.5rem;
      border-bottom: 1px solid var(--bone);
    }
    .features-header h2 {
      font-family: var(--serif);
      font-size: clamp(1.8rem, 3vw, 3rem);
      font-weight: 400;
      line-height: 1.2;
    }
    .features-header p {
      font-size: 0.95rem;
      color: var(--text-lt);
      line-height: 1.8;
    }
    .features-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
    }
    .feat-card {
      padding: 2.5rem 2.5rem 2.5rem 0;
      border-top: 1px solid var(--bone);
      border-right: 1px solid var(--bone);
    }
    .feat-card:nth-child(3n) { border-right: none; }
    .feat-card:nth-child(n+4) { /* no extra border needed */ }
    .feat-icon {
      width: 22px; height: 22px;
      color: var(--terra);
      margin-bottom: 1.2rem;
      display: block;
    }
    .feat-icon svg { width: 100%; height: 100%; }
    .feat-card h3 {
      font-family: var(--serif);
      font-size: 1.15rem;
      font-weight: 400;
      margin-bottom: 0.6rem;
    }
    .feat-card p {
      font-size: 0.87rem;
      color: var(--text-lt);
      line-height: 1.75;
    }

    /* ─── QUOTE ─── */
    #quote {
      padding: 8rem 7vw;
      background: var(--black);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    #quote::before {
      content: '"';
      font-family: var(--serif);
      font-size: 24rem;
      color: rgba(255,255,255,0.04);
      position: absolute;
      top: -5rem;
      left: 50%;
      transform: translateX(-50%);
      line-height: 1;
      pointer-events: none;
    }
    #quote blockquote {
      position: relative;
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(1.4rem, 2.8vw, 2.4rem);
      font-weight: 400;
      line-height: 1.55;
      color: rgba(255,255,255,0.88);
      max-width: 680px;
      margin: 0 auto 1.8rem;
    }
    #quote cite {
      font-size: 0.66rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--terra-lt);
      font-style: normal;
    }

    /* ─── SLIDER ─── */
    #slider-section {
      background: var(--white);
      padding: 7rem 0;
      overflow: hidden;
    }
    .slider-head {
      text-align: center;
      padding: 0 7vw;
      margin-bottom: 3rem;
    }
    .rule {
      width: 36px; height: 1px;
      background: var(--terra);
      margin: 0 auto 1.5rem;
    }
    .slider-head h2 {
      font-family: var(--serif);
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      font-weight: 400;
    }
    .slider-wrap { overflow: hidden; }
    .slider-track {
      display: flex;
      transition: transform 0.65s cubic-bezier(0.77,0,0.175,1);
    }
    .slide {
      min-width: 100%;
      height: 62vh;
      min-height: 380px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .slide img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
    .slider-foot {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      margin-top: 2.5rem;
      padding: 0 7vw;
    }
    .s-btn {
      background: none;
      border: 1px solid var(--stone);
      width: 46px; height: 46px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--text-lt);
      transition: border-color 0.2s, color 0.2s;
    }
    .s-btn:hover { border-color: var(--terra); color: var(--terra); }
    .s-count {
      font-family: var(--serif);
      font-size: 0.9rem;
      color: var(--stone);
      letter-spacing: 0.1em;
      min-width: 56px;
      text-align: center;
    }

    /* ─── BOOKING ─── */
    #booking { display: grid; grid-template-columns: 1fr 1fr; }
    .booking-left {
      background: var(--bone);
      padding: 7rem 5rem 7rem 8vw;
      display: flex; flex-direction: column; justify-content: center;
    }
    .booking-left h2 {
      font-family: var(--serif);
      font-size: clamp(1.8rem, 2.8vw, 2.6rem);
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 1.2rem;
    }
    .booking-left p {
      font-size: 0.95rem;
      color: var(--text-lt);
      line-height: 1.8;
      max-width: 44ch;
      margin-bottom: 0.8rem;
    }
    .booking-perks {
      margin: 1.5rem 0 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .booking-perk {
      font-size: 0.88rem;
      color: var(--text-lt);
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }
    .booking-perk::before {
      content: '';
      display: inline-block;
      width: 16px; height: 1px;
      background: var(--terra);
      flex-shrink: 0;
    }
    .also-on {
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid var(--stone);
    }
    .also-label {
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--stone);
      display: block;
      margin-bottom: 0.7rem;
    }
    .plat-links { display: flex; gap: 1.2rem; }
    .plat {
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--text-lt);
      border-bottom: 1px solid var(--stone);
      padding-bottom: 2px;
      transition: color 0.2s, border-color 0.2s;
    }
    .plat:hover { color: var(--terra); border-color: var(--terra); }
    .booking-right {
      background: var(--white);
      padding: 7rem 8vw 7rem 5rem;
      display: flex; flex-direction: column; justify-content: center;
    }
    .booking-right h3 {
      font-family: var(--serif);
      font-size: 1.5rem;
      font-weight: 400;
      margin-bottom: 2rem;
    }
    .form-group {
      display: flex; flex-direction: column;
      margin-bottom: 1.2rem;
    }
    .form-group label {
      font-size: 0.62rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--stone);
      margin-bottom: 0.35rem;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--bone);
      padding: 0.65rem 0;
      font-family: var(--sans);
      font-size: 0.95rem;
      font-weight: 300;
      color: var(--text);
      outline: none;
      transition: border-color 0.25s;
      width: 100%;
      border-radius: 0;
      -webkit-appearance: none;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-bottom-color: var(--terra); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-group textarea { resize: none; height: 80px; }
    .btn-submit {
      margin-top: 1.2rem;
      width: 100%;
      padding: 1rem;
      background: var(--terra);
      color: var(--white);
      font-family: var(--sans);
      font-size: 0.73rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      transition: background 0.25s;
    }
    .btn-submit:hover { background: var(--terra-dk); }

    /* ─── MAP ─── */
    #map { display: grid; grid-template-columns: 1fr 2fr; }
    .map-info {
      padding: 4rem 3.5rem;
      background: var(--white);
      border-right: 1px solid var(--bone);
      display: flex; flex-direction: column; justify-content: center;
    }
    .map-info h3 {
      font-family: var(--serif);
      font-size: 1.6rem;
      font-weight: 400;
      margin: 0.5rem 0 1.2rem;
    }
    .map-info p {
      font-size: 0.9rem;
      color: var(--text-lt);
      line-height: 1.8;
      margin-bottom: 0.5rem;
    }
    .map-note {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--bone);
      font-size: 0.78rem !important;
      color: var(--stone) !important;
      font-style: italic;
    }
    .map-frame { overflow: hidden; }
    .map-frame iframe {
      width: 100%; height: 100%;
      border: none; display: block;
      min-height: 420px;
      filter: saturate(0.5) contrast(1.05);
    }

    /* ─── FOOTER ─── */
    footer {
      background: var(--black);
      padding: 6rem 8vw 0;
    }
    .footer-grid {
      display: grid;
      grid-template-columns: 1.6fr 1fr 1fr;
      gap: 5rem;
      padding-bottom: 4rem;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .footer-name {
      font-family: var(--serif);
      font-size: 1.4rem;
      font-weight: 400;
      color: var(--white);
      display: block;
      margin-bottom: 0.8rem;
    }
    .footer-brand p {
      font-size: 0.87rem;
      color: rgba(255,255,255,0.35);
      line-height: 1.7;
      max-width: 28ch;
    }
    .footer-col-title {
      font-size: 0.6rem;
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.22);
      display: block;
      margin-bottom: 1.5rem;
    }
    .footer-col a {
      display: block;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.48);
      text-decoration: none;
      margin-bottom: 0.7rem;
      transition: color 0.2s;
    }
    .footer-col a:hover { color: var(--terra-lt); }
    .footer-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 0;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.18);
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 960px) {
      #nav { grid-template-columns: auto 1fr; padding: 1rem 1.5rem; }
      .nav-left { display: none; }
      .nav-right { justify-content: flex-end; }

      .hero-content { padding: 0 1.5rem 0 1.5rem; }
      .hero-title { font-size: clamp(2.8rem, 12vw, 5rem); }

      #trullo { grid-template-columns: 1fr; }
      .intro-text { padding: 5rem 2rem; }
      .intro-photo { height: 60vw; }

      .info-strip { grid-template-columns: 1fr 1fr; }
      .info-item { border-bottom: 1px solid var(--stone); }

      #gallery {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto;
      }
      .g-item { height: 200px; }
      .g-item.tall { grid-row: span 1; height: 200px; }

      .features-header { grid-template-columns: 1fr; gap: 2rem; }
      .features-grid { grid-template-columns: 1fr 1fr; }

      #booking { grid-template-columns: 1fr; }
      .booking-left { padding: 5rem 2rem 3rem; }
      .booking-right { padding: 3rem 2rem 5rem; }
      .form-row { grid-template-columns: 1fr; }

      #map { grid-template-columns: 1fr; }
      .map-info { padding: 3rem 2rem; border-right: none; border-bottom: 1px solid var(--bone); }
      .map-frame iframe { min-height: 300px; }

      .footer-grid { grid-template-columns: 1fr; gap: 3rem; }
      .footer-bottom { flex-direction: column; gap: 0.5rem; text
